aid: caronsale
name: CarOnSale
description: 'CarOnSale is an AI-supported B2B marketplace for used-car trading across Europe, operated
  by Castle Tech GmbH. Licensed dealers, OEMs, fleet operators, and leasing companies buy and sell
  used vehicles through digital auctions built on standardized 110-point condition assessments,
  AI-based pricing and valuation, and integrated transport and financing services. The platform
  connects sellers (dealer groups, OEMs, leasing and rental companies) with a European network of
  professional buyers, handling procurement, price discovery, settlement, and logistics end to end.
  Added to the API Evangelist network as a venture-portfolio company; no public developer API surface
  was found during enrichment.'
